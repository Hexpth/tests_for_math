<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по теме «Линейная функция» (9 класс, ОГЭ)</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #4a90e2;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 650px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 22px;
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 15px;
        }

        .meta-info {
            font-size: 13px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .question-box {
            display: none;
        }

        .question-box.active {
            display: block;
        }

        .question-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #34495e;
        }

        .question-text {
            font-size: 17px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-item {
            background-color: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 14px 18px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .option-item:hover {
            background-color: #eef2f7;
            border-color: var(--primary-color);
        }

        .option-item.correct {
            background-color: #e8f8f0;
            border-color: var(--success-color);
            color: #1e7e34;
            font-weight: 500;
        }

        .option-item.incorrect {
            background-color: #fde8e8;
            border-color: var(--error-color);
            color: #bd2130;
        }

        .option-item.disabled {
            pointer-events: none;
        }

        .feedback {
            margin-top: 15px;
            padding: 12px 15px;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
            display: none;
        }

        .feedback.visible {
            display: block;
        }

        .feedback.correct-fb {
            background-color: #e8f8f0;
            color: #1e7e34;
            border-left: 4px solid var(--success-color);
        }

        .feedback.incorrect-fb {
            background-color: #fde8e8;
            color: #bd2130;
            border-left: 4px solid var(--error-color);
        }

        .hint-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            margin-bottom: 15px;
            text-decoration: underline;
        }

        .hint-text {
            display: none;
            background-color: #fff9e6;
            border-left: 4px solid #f1c40f;
            padding: 10px 15px;
            font-size: 14px;
            color: #7f6000;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
        }

        button.nav-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.nav-btn:hover {
            background-color: #357abd;
        }

        button.nav-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .result-box {
            display: none;
            text-align: center;
        }

        .result-box h2 {
            color: #2c3e50;
        }

        .score {
            font-size: 48px;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <h1>Тест: Линейная функция (Занятие №2)</h1>
    <div class="meta-info" id="progress-text">Вопрос 1 из 5</div>

    <!-- Вопросы генерируются через JS -->
    <div id="quiz-questions"></div>

    <div class="nav-buttons">
        <button class="nav-btn" id="prev-btn" disabled>Назад</button>
        <button class="nav-btn" id="next-btn" disabled>Вперед</button>
    </div>

    <div class="result-box" id="result-box">
        <h2>Тест завершен!</h2>
        <div class="score" id="score-text">0 / 5</div>
        <p id="result-comment"></p>
        <button class="nav-btn" onclick="location.reload()">Пройти еще раз</button>
    </div>
</div>

<script>
    // Массив данных со всеми 5 вопросами
    const quizData = [
        {
            topic: "Угловой коэффициент и взаимное расположение графиков",
            question: "График линейной функции проходит через точку (0; -3) и параллелен прямой y = 2x + 5. Задайте формулой эту функцию.",
            hint: "Вспомните условие параллельности двух прямых на плоскости. Какой коэффициент определяет наклон прямой и как найти коэффициент b, зная точку пересечения с осью y?",
            options: [
                { text: "y = -3x + 2", isCorrect: false, reason: "Неверно. Угловой коэффициент k должен быть равен 2, так как графики параллельных прямых имеют одинаковый угловой коэффициент." },
                { text: "y = -2x - 3", isCorrect: false, reason: "Неверно. Обратите внимание на знак углового коэффициента k: он должен совпадать с коэффициентом параллельной прямой (k = 2)." },
                { text: "y = 2x - 3", isCorrect: true, reason: "Верно! Параллельные прямые имеют одинаковый угловой коэффициент k = 2, а свободный член b равен значению функции при x = 0, то есть -3." },
                { text: "y = 2x + 3", isCorrect: false, reason: "Неверно. Свободный член b отвечает за пересечение с осью ординат и равен ординате точки (0; -3), то есть -3, а не +3." }
            ]
        },
        {
            topic: "Нули линейной функции",
            question: "Найдите абсциссу точки пересечения графика функции y = -1,5x + 6 с осью x.",
            hint: "Точка на оси x всегда имеет координату y = 0. Подставьте это значение в уравнение функции и решите простейшее линейное уравнение.",
            options: [
                { text: "-6", isCorrect: false, reason: "Неверно. Приравняв y к нулю, вы получите уравнение -1,5x + 6 = 0. Перенесите слагаемые и аккуратно выполните деление." },
                { text: "6", isCorrect: false, reason: "Неверно. Значение 6 — это ордината точки пересечения графика с осью y (при x = 0). Для оси x нужно найти значение x, при котором y = 0." },
                { text: "-4", isCorrect: false, reason: "Неверно с точки зрения знака. При делении 6 на 1,5 или -6 на -1,5 знак результата будет положительным." },
                { text: "4", isCorrect: true, reason: "Отлично! Точка пересечения с осью x имеет ординату y = 0. Подставив это значение, получаем -1,5x + 6 = 0 => 1,5x = 6 => x = 4." }
            ]
        },
        {
            topic: "Возрастание и убывание линейной функции",
            question: "При каком значении коэффициента p линейная функция y = (2p - 8)x + 3 является строго убывающей?",
            hint: "Линейная функция вида y = kx + b убывает тогда и только тогда, когда её угловой коэффициент k строго меньше нуля. В данном случае в роли k выступает выражение (2p - 8).",
            options: [
                { text: "p > 4", isCorrect: false, reason: "Неверно. Если p > 4, то выражение (2p - 8) будет больше нуля, а значит, угловой коэффициент будет положительным, и функция будет возрастать." },
                { text: "p < 4", isCorrect: true, reason: "Верно! Для убывания функции необходимо, чтобы угловой коэффициент k < 0. Составим неравенство: 2p - 8 < 0 => 2p < 8 => p < 4." },
                { text: "p < -4", isCorrect: false, reason: "Неполный или неверный ответ. Хотя при p < -4 функция убывает, она также убывает и при других значениях (например, при p = 0). Граница находится в точке 4." },
                { text: "p = 4", isCorrect: false, reason: "Неверно. При p = 4 угловой коэффициент становится равен нулю: функция превращается в y = 3. Она становится постоянной (ни возрастает, ни убывает)." }
            ]
        },
        {
            topic: "Принадлежность точки графику функции",
            question: "Проходит ли график функции y = -4x + 7 через точку А(-2; 15)?",
            hint: "Подставьте координаты точки А в уравнение функции вместо x и y: значение -2 вместо x, а 15 вместо y. Проверьте, получится ли верное числовое равенство.",
            options: [
                { text: "Да, проходит", isCorrect: true, reason: "Верно! Подставляем x = -2 в уравнение: y = -4 * (-2) + 7 = 8 + 7 = 15. Числовое равенство 15 = 15 верно." },
Use code with caution.
{ text: "Нет, не проходит", isCorrect: false, reason: "Неверно. Убедитесь, что вы правильно перемножили два отрицательных числа: -4 умножить на -2 дает положительное число +8." },
{ text: "График проходит только при положительных x", isCorrect: false, reason: "Неверно. Линейная функция определена для любых x. Данная точка с отрицательной абсциссой лежит на графике." },
{ text: "Определить невозможно", isCorrect: false, reason: "Неверно. Мы знаем и точные координаты точки, и аналитическую формулу функции, поэтому положение точки определяется однозначно." }
]
},
{
topic: "Геометрический смысл коэффициента b",
question: "В какой точке график функции y = 0.5x - 7 пересекает ось ординат (ось y)?",
hint: "Любая точка, лежащая на оси y, имеет абсциссу x = 0. Подставьте x = 0 в уравнение функции и найдите соответствующее значение y.",
options: [
{ text: "(14; 0)", isCorrect: false, reason: "Неверно. Это точка пересечения с осью абсцисс (осью x), так как здесь y = 0, а нам нужна ось ординат." },
{ text: "(0; 7)", isCorrect: false, reason: "Неверно. Обратите внимание на знак перед свободным членом в исходной формуле функции: там стоит минус." },
{ text: "(-7; 0)", isCorrect: false, reason: "Неверно. Координаты перепутаны местами. На первом месте всегда пишется x, а для оси y координата x должна быть строго равна нулю." },
{ text: "(0; -7)", isCorrect: true, reason: "Абсолютно верно! При x = 0 получаем y = 0.5 * 0 - 7 = -7. Свободный член b всегда показывает ординату точки пересечения с осью y." }
]
}
];
let currentQuestionIndex = 0;
let score = 0;
const userAnswers = new Array(quizData.length).fill(null);
const questionsContainer = document.getElementById('quiz-questions');
const progressText = document.getElementById('progress-text');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const resultBox = document.getElementById('result-box');
const scoreText = document.getElementById('score-text');
const resultComment = document.getElementById('result-comment');
function initQuiz() {
quizData.forEach((data, index) => {
const questionBox = document.createElement('div');
questionBox.className = question-box ${index === 0 ? 'active' : ''};
questionBox.id = q-${index};
questionBox.innerHTML = <div class="question-title">${data.topic}</div> <div class="question-text">${data.question}</div> <button class="hint-btn" onclick="toggleHint(${index})">Показать подсказку</button> <div class="hint-text" id="hint-${index}">${data.hint}</div> <ul class="options-list"> ${data.options.map((opt, optIndex) =>
${opt.text}
).join('')} </ul> <div class="feedback" id="fb-${index}"></div> ;
questionsContainer.appendChild(questionBox);
});
updateNavigation();
}
window.toggleHint = function(qIndex) {
const hintBlock = document.getElementById(hint-${qIndex});
const hintBtn = hintBlock.previousElementSibling;
if (hintBlock.style.display === 'block') {
hintBlock.style.display = 'none';
hintBtn.textContent = 'Показать подсказку';
} else {
hintBlock.style.display = 'block';
hintBtn.textContent = 'Скрыть подсказку';
}
};
window.selectOption = function(qIndex, optIndex, element) {
if (userAnswers[qIndex] !== null) return;
const question = quizData[qIndex];
const selectedOption = question.options[optIndex];
userAnswers[qIndex] = optIndex;
const container = document.getElementById(q-${qIndex});
const items = container.querySelectorAll('.option-item');
const feedbackDiv = document.getElementById(fb-${qIndex});
items.forEach((item, idx) => {
item.classList.add('disabled');
if (question.options[idx].isCorrect) {
item.classList.add('correct');
}
});
if (selectedOption.isCorrect) {
element.classList.add('correct');
feedbackDiv.className = 'feedback visible correct-fb';
feedbackDiv.textContent = selectedOption.reason;
score++;
} else {
element.classList.add('incorrect');
feedbackDiv.className = 'feedback visible incorrect-fb';
feedbackDiv.textContent = selectedOption.reason;
}
nextBtn.disabled = false;
};
function updateNavigation() {
progressText.textContent = Вопрос ${currentQuestionIndex + 1} из ${quizData.length};
prevBtn.disabled = currentQuestionIndex === 0;
if (userAnswers[currentQuestionIndex] !== null) {
nextBtn.disabled = false;
if (currentQuestionIndex === quizData.length - 1) {
nextBtn.textContent = 'Завершить';
} else {
nextBtn.textContent = 'Вперед';
}
} else {
nextBtn.disabled = true;
nextBtn.textContent = 'Вперед';
}
}
nextBtn.addEventListener('click', () => {
if (currentQuestionIndex < quizData.length - 1) {
document.getElementById(q-${currentQuestionIndex}).classList.remove('active');
currentQuestionIndex++;
document.getElementById(q-${currentQuestionIndex}).classList.add('active');
updateNavigation();
} else {
showResults();
}
});
prevBtn.addEventListener('click', () => {
if (currentQuestionIndex > 0) {
document.getElementById(q-${currentQuestionIndex}).classList.remove('active');
currentQuestionIndex--;
document.getElementById(q-${currentQuestionIndex}).classList.add('active');
updateNavigation();
}
});
function showResults() {
questionsContainer.style.display = 'none';
document.querySelector('.nav-buttons').style.display = 'none';
progressText.style.display = 'none';
scoreText.textContent = ${score} / ${quizData.length};
let comment = "";
if (score === quizData.length) {
comment = "Великолепный результат! Вы идеально сдали тему линейной функции. Удачи на ОГЭ!";
} else if (score >= 3) {
comment = "Хороший результат! Большинство задач решено верно, но стоит повторить некоторые правила и знаки.";
} else {
comment = "Тема усвоена слабо. Рекомендуется повторить геометрический смысл коэффициентов k и b, а также потренироваться в решении уравнений.";
}
resultComment.textContent = comment;
resultBox.style.display = 'block';
}
initQuiz();
