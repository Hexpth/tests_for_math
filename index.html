<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему тестирования</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        input {
            padding: 12px;
            font-size: 16px;
            width: 100%;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #4a90e2;
            outline: none;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background-color: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #357abd;
        }
        .error {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 14px;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Введите номер занятия</h2>
    <form id="redirectForm">
        <input type="number" id="testNumber" placeholder="Например: 2" required min="1"><br>
        <button type="submit">Перейти к тесту</button>
    </form>
    <div id="errorMessage" class="error"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('redirectForm');
        const input = document.getElementById('testNumber');
        const errorDiv = document.getElementById('errorMessage');

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            
            const testNum = input.value.trim();
            if (testNum) {
                // Вычисляем базовый путь динамически для стабильной работы на GitHub Pages
                const currentUrl = window.location.href.split('?')[0].split('#')[0];
                const baseUrl = currentUrl.endsWith('index.html') ? currentUrl.replace('index.html', '') : currentUrl.endsWith('/') ? currentUrl : currentUrl + '/';
                
                window.location.href = baseUrl + `test${testNum}.html`;
            } else {
                errorDiv.textContent = 'Пожалуйста, введите корректный номер.';
            }
        });
    });
</script>

</body>
</html>
