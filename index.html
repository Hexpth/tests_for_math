<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему тестирования</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 150px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Введите номер вашего теста</h2>
    <form id="redirectForm">
        <input type="number" id="testNumber" placeholder="Например: 1" required min="1"><br>
        <button type="submit">Перейти к тесту</button>
    </form>
    <div id="errorMessage" class="error"></div>
</div>

<script>
    document.getElementById('redirectForm').addEventListener('submit', function(event) {
        event.preventDefault(); // Отменяем стандартную отправку формы
        
        const testNum = document.getElementById('testNumber').value.trim();
        const errorDiv = document.getElementById('errorMessage');
        
        if (testNum) {
            window.location.href = `./test${TestNum}.html`;
        } else {
            errorDiv.textContent = 'Пожалуйста, введите корректный номер.';
        }
    });
</script>

</body>
</html>
